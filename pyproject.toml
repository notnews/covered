[project]
name = "covered"
dynamic = ["version"]
description = "HHI of quote attribution and on-air source concentration in CNN transcripts, 2000-2025"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Gaurav Sood" }]
keywords = [
    "media",
    "news",
    "quote-attribution",
    "herfindahl-hirschman-index",
    "source-concentration",
    "computational-social-science",
]
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pandera>=0.36.0",
    "pyDataverse>=0.3.5",
    "spacy>=3.8.18,<3.9",
    "rapidfuzz>=3.14.6",
    "metaphone>=0.6",
    "numpy>=2.5.5",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
    "typer>=0.29.1",
    "click>=8.5.1",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
llm = ["anthropic>=2.8.0"]

[project.scripts]
covered = "covered.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/covered"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
"scripts/**" = ["D", "T20", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config", "--strict-markers", "-ra"]
pythonpath = ["src"]
minversion = "6"
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["covered"]
branch = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
# "pres" is the `president_share_annual.csv` dataframe abbreviation used
# throughout figures.py/roles.py, not a typo of "press".
ignore-words-list = "pres"
# All *.csv files here are reference lookups or generated data tables
# containing real transcript-derived proper nouns, not prose -- skip them.
skip = "*.csv,uv.lock"

[dependency-groups]
docs = ["sphinx>=9.1.1", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
# Everything actually needed to run the test suite (canon's wheel-smoke-test
# job installs only this group, not `dev`, against a built wheel).
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    # Tests load this spacy model by name; declaring it as a normal
    # URL-pinned dependency lets `uv sync`/`uv pip install --group test`
    # install it (canon's reusable CI has no hook for an imperative
    # `spacy download` step).
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # The Monte Carlo gates behind tests/test_metrics_coverage.py. A git
    # reference, so it stays in dependency-groups and out of the published
    # extras: PyPI rejects direct URL references in published metadata.
    "simcheck @ git+https://github.com/finite-sample/simcheck",
]
dev = [
    "ruff>=0.17.5",
    "pyright>=1.1.414",
    "pydoclint>=0.12.0",
    "pre-commit>=4.7.0",
    "pandas-stubs",
    { include-group = "test" },
]

[tool.preen]
# preen's `metadata` check wants the fleet's uv_build backend. This repo still
# builds with hatchling + hatch-vcs, which derive the version from git tags;
# moving it is its own change. The old reason for this skip, a <3.14 bound
# because spacy shipped no cp314 wheel, is gone: spacy 3.8.18 ships cp314.
skip_checks = ["metadata"]
