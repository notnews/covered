[project]
name = "covered"
dynamic = ["version"]
description = "HHI of quote attribution and on-air source concentration in CNN transcripts, 2000-2025"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = [
    "media",
    "news",
    "quote-attribution",
    "herfindahl-hirschman-index",
    "source-concentration",
    "computational-social-science",
]
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pandera>=0.32.1",
    "pyDataverse>=0.3.5",
    "spacy>=3.7,<3.9",
    "rapidfuzz>=3.14.5",
    "metaphone>=0.6",
    "numpy>=1.26",
    "scipy>=1.17.1",
    "matplotlib>=3.11.1",
    "typer>=0.27.0",
    "click>=8.1",
]
license-files = ["LICENSE"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[project.scripts]
covered = "covered.cli:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/covered"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]
"scripts/**" = ["D", "T20", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["covered"]
branch = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.codespell]
# "pres" is the `president_share_annual.csv` dataframe abbreviation used
# throughout figures.py/roles.py, not a typo of "press".
ignore-words-list = "pres"
# All *.csv files here are reference lookups or generated data tables
# containing real transcript-derived proper nouns, not prose -- skip them.
skip = "*.csv,uv.lock"

[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
# Everything actually needed to run the test suite (canon's wheel-smoke-test
# job installs only this group, not `dev`, against a built wheel).
test = [
    "pytest>=8",
    "pytest-cov>=5",
    # Tests load this spacy model by name; declaring it as a normal
    # URL-pinned dependency lets `uv sync`/`uv pip install --group test`
    # install it (canon's reusable CI has no hook for an imperative
    # `spacy download` step).
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # The Monte Carlo gates behind tests/test_metrics_coverage.py. A git
    # reference, so it stays in dependency-groups and out of the published
    # extras: PyPI rejects direct URL references in published metadata.
    "simcheck @ git+https://github.com/finite-sample/simcheck",
]
dev = [
    "ruff>=0.14",
    "pyright>=1.1.411",
    "pydoclint>=0.5",
    "pre-commit>=4.6.1",
    "pandas-stubs",
    { include-group = "test" },
]

[tool.preen]
# The standard says no upper bound on requires-python, and preen's `metadata`
# check enforces that. This repo has to differ: spacy ships no cp314 wheel and
# no sdist at all, so `<3.14` is not caution, it is the truth about what can be
# installed.
#
#   $ curl -s https://pypi.org/pypi/spacy/3.8.15/json | jq '[.urls[].filename]'
#   wheel ABI tags: cp310, cp311, cp312, cp313      sdist present: false
#
# Confirmed by trying it: `uv run --python 3.14 pytest` fails at install with
# "spacy (v3.8.15) only has wheels with the following Python ABI tags: cp311,
# cp312, cp313". Drop this skip and the bound together, once spacy ships cp314.
skip_checks = ["metadata"]
