[project]
name = "covered"
version = "0.1.0"
description = "HHI of quote attribution and on-air source concentration in CNN transcripts, 2000-2025"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = [
    "media",
    "news",
    "quote-attribution",
    "herfindahl-hirschman-index",
    "source-concentration",
    "computational-social-science",
]
dependencies = [
    "pandas>=2.1",
    "pyarrow>=14",
    "pandera>=0.18",
    "pyDataverse>=0.3.3",
    "spacy>=3.7,<3.9",
    "rapidfuzz>=3.5",
    "metaphone>=0.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "typer>=0.12",
    "click>=8.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "pre-commit>=3.7",
]

[project.scripts]
covered = "covered.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/covered"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["covered"]

[tool.mypy]
python_version = "3.11"
packages = ["covered"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.coverage.run]
source = ["covered"]
branch = true
