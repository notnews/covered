name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: covered
      coverage-floor: 0
      # TODO(pydoclint): re-enable once pydoclint's docstring_parser_fork pin
      # and anthropic's docstring-parser (llm extra) stop colliding on the
      # `docstring_parser` import namespace when `uv sync --all-groups
      # --all-extras` installs both into one venv. `pydoclint src/` itself
      # reports zero violations in isolation (verified 2026-07-24) -- this is
      # a packaging conflict, not a lint failure.
      run-pydoclint: false
