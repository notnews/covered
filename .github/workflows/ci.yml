name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly: surface ecosystem drift on quiet repos

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: gojiplus/py-canon/.github/workflows/reusable-ci.yml@v1
    with:
      wheel-import: covered
      coverage-floor: 84
      run-preen: true
      # spacy 3.8.14's PyPI classifiers claim 3.14 support, but it ships no
      # cp314 wheel (or sdist) yet -- requires-python caps at <3.14 for real,
      # so override canon's default ["3.11", "3.14"] matrix accordingly.
      python-versions: '["3.12", "3.13"]'
      run-pydoclint: true
