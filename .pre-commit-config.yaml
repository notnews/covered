# Run from the analysis/ directory: `uv run pre-commit install`
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^analysis/(src|tests)/
      - id: ruff-format
        files: ^analysis/(src|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^analysis/src/
        args: [--config-file, analysis/pyproject.toml]
        additional_dependencies:
          - pandas-stubs
          - types-requests
